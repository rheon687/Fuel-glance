<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Fuel Glance</title></head>
<body><main id="app" aria-live="polite">
<section id="glance-view"><div id="pull" aria-hidden="true">↓</div><div id="stations"></div><div id="status">Loading prices…</div><button id="manage-button" class="icon-button" type="button" aria-label="Manage stations" title="Manage stations">
<svg class="pump-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 42V8a4 4 0 0 1 4-4h18a4 4 0 0 1 4 4v34M10 22h26M16 10h14v7H16zM7 42h33M36 12h4l4 6v17c0 3-2 5-4 5s-4-2-4-5v-8h5v-8l-4-5"/></svg>
</button></section>
<section id="manage-view" hidden><header class="manage-header"><button id="back-button" type="button" class="text-button">‹ Back</button><h1>Your stations</h1><span></span></header><div id="station-list"></div><button id="add-button" type="button" class="primary-button">+ Add station</button><p id="limit-note"></p></section>
<section id="search-view" hidden><header class="manage-header"><button id="search-back" type="button" class="text-button">‹ Back</button><h1>Add station</h1><span></span></header><form id="postcode-form"><label for="postcode">Postcode</label><div class="input-row"><input id="postcode" name="postcode" autocomplete="postal-code" maxlength="9" placeholder="e.g. SK3 0RL" required><button class="primary-button" type="submit">Find</button></div></form><div id="search-status" class="form-status" aria-live="polite"></div><div id="matches"></div></section>
<section id="name-view" hidden><header class="manage-header"><button id="name-back" type="button" class="text-button">‹ Back</button><h1 id="name-title">Name station</h1><span></span></header><div id="selected-station" class="selected-station"></div><form id="name-form"><label for="friendly-name">Friendly name</label><input id="friendly-name" maxlength="24" required><button class="primary-button full" type="submit">Save</button></form></section>
</main><script type="module" src="app.js"></script></body></html>
